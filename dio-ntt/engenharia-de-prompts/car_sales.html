<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Carros Usados - DIO</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        header {
            background: #1a237e;
            color: #fff;
            padding: 40px 0 20px 0;
            text-align: center;
        }
        header h1 {
            font-size: 3em;
            margin: 0;
            letter-spacing: 2px;
        }
        main {
            max-width: 900px;
            margin: 40px auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 14px 10px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }
        th {
            background: #3949ab;
            color: #fff;
        }
        tr:hover {
            background: #f1f1f1;
        }
        .buy-btn {
            background: #1a237e;
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1em;
            transition: background 0.2s;
        }
        .buy-btn:hover {
            background: #3949ab;
        }
    </style>
</head>
<body>
    <header>
        <h1>DIO - Carros Usados</h1>
        <p>Encontre o seu próximo carro com segurança e confiança!</p>
    </header>
    <main>
        <h2>Estoque de Carros</h2>
        <table>
            <thead>
                <tr>
                    <th>Modelo</th>
                    <th>Ano</th>
                    <th>Quilometragem</th>
                    <th>Preço</th>
                    <th>Comprar</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Volkswagen Gol</td>
                    <td>2018</td>
                    <td>45.000 km</td>
                    <td>R$ 38.900</td>
                    <td><button class="buy-btn">Comprar</button></td>
                </tr>
                <tr>
                    <td>Chevrolet Onix</td>
                    <td>2020</td>
                    <td>22.000 km</td>
                    <td>R$ 54.500</td>
                    <td><button class="buy-btn">Comprar</button></td>
                </tr>
                <tr>
                    <td>Fiat Argo</td>
                    <td>2019</td>
                    <td>30.500 km</td>
                    <td>R$ 47.900</td>
                    <td><button class="buy-btn">Comprar</button></td>
                </tr>
                <tr>
                    <td>Honda Civic</td>
                    <td>2017</td>
                    <td>60.000 km</td>
                    <td>R$ 79.000</td>
                    <td><button class="buy-btn">Comprar</button></td>
                </tr>
            </tbody>
        </table>
    </main>
</body>
</html>
